name: release

# Triggered manually with a version number.
# Full flow:
#   1. Validate version (semver, greater than current)
#   2. Run test suite — abort on failure
#   3. Bump VERSION, commit, push to main
#   4. Create annotated tag
#   5. Build .deb and SHA256SUMS, create GitHub Release, attach both
#   6. Compute tarball SHA256, update Homebrew formula in this repo
#   7. Push updated formula to homebrew-agentguard tap
#   8. Run package tests on all supported OS targets (parallel matrix)
#   9. Summarise results — marks the workflow run pass/fail

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.5.0 — no leading v)'
        required: true
        type: string

jobs:
  # ── 1-7. Release ────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. validate input ─────────────────────────────────────────────────
      # The input is passed via env, never interpolated into the script, so a
      # crafted value cannot inject shell before the semver check runs.
      - name: Validate version input
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: '$VERSION' is not valid semver (expected X.Y.Z)"
            exit 1
          fi
          CURRENT="$(cat VERSION | tr -d '[:space:]')"
          semver_gt() {
            [ "$1" = "$2" ] && return 1
            [ "$(printf '%s\n%s' "$1" "$2" | sort -V | head -1)" != "$1" ]
          }
          if ! semver_gt "$VERSION" "$CURRENT"; then
            echo "ERROR: $VERSION is not greater than current $CURRENT"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (current: $CURRENT)"

      # ── 2. run test suite ─────────────────────────────────────────────────
      - name: Install test dependencies
        run: sudo apt-get install -y jq

      - name: Run tests
        run: |
          bash tests/check-sync.sh
          bash install.sh all
          bash tests/run_all.sh

      # ── 3. bump VERSION ───────────────────────────────────────────────────
      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump VERSION and commit
        run: |
          echo "$VERSION" > VERSION
          git add VERSION
          git commit -m "chore(release): bump version to $VERSION"
          git push origin main

      # ── 4. create tag ─────────────────────────────────────────────────────
      - name: Create and push tag
        run: |
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      # ── 5. build .deb and create GitHub Release ───────────────────────────
      - name: Install build dependencies
        run: sudo apt-get install -y dpkg-dev lintian

      - name: Build .deb package
        run: bash packaging/deb/build.sh dist/

      # `agentguard upgrade` on a .deb install verifies the download against this file.
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum -- *.deb > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release and upload .deb
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/SHA256SUMS

      # ── 6. compute tarball SHA256 and update Homebrew formula ─────────────
      - name: Compute tarball SHA256
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$VERSION.tar.gz"
          for i in 1 2 3 4 5; do
            sleep 30
            SHA1=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            sleep 10
            SHA2=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            if [[ "$SHA1" == "$SHA2" && -n "$SHA1" ]]; then
              echo "SHA256 stable after $i attempt(s): $SHA1"
              SHA256="$SHA1"
              echo "SHA256=$SHA256" >> "$GITHUB_ENV"
              break
            fi
            echo "Attempt $i: SHA256 unstable ($SHA1 vs $SHA2), retrying..."
          done
          [[ -n "${SHA256:-}" ]] || { echo "ERROR: SHA256 never stabilised"; exit 1; }

      - name: Update Homebrew formula in this repo
        run: |
          sed -i "s|refs/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|refs/tags/v$VERSION.tar.gz|" homebrew/Formula/agentguard.rb
          sed -i "s/sha256 \"[a-f0-9]*\"/sha256 \"$SHA256\"/" homebrew/Formula/agentguard.rb
          git add homebrew/Formula/agentguard.rb
          git diff --cached --quiet || git commit -m "chore(homebrew): update formula to v$VERSION"
          git push origin main

      # ── 7. push formula to tap repo ───────────────────────────────────────
      - name: Push formula to homebrew-agentguard tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_deploy_key -o IdentitiesOnly=yes"

          git clone git@github.com:SumonMSelim/homebrew-agentguard.git /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp homebrew/Formula/agentguard.rb /tmp/tap/Formula/agentguard.rb

          cd /tmp/tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agentguard.rb
          git diff --cached --quiet || git commit -m "feat: update agentguard to v$VERSION"
          git push origin main

          rm -f ~/.ssh/tap_deploy_key

  # ── 8a. Wait for GitHub CDN tarball to stabilise ────────────────────────────
  # Homebrew verifies the tarball SHA in the formula, so its tests must wait.
  # The deb legs share the matrix job below and wait too.
  wait-for-cdn:
    name: Wait for tarball SHA to stabilise
    runs-on: ubuntu-latest
    needs: release
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Poll until tarball SHA is stable
        id: check
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          for i in $(seq 1 10); do
            SHA1=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            sleep 15
            SHA2=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            if [[ "$SHA1" == "$SHA2" && -n "$SHA1" ]]; then
              echo "SHA stable after $i attempt(s): $SHA1"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: SHA unstable, retrying..."
          done
          echo "ERROR: SHA never stabilised"
          exit 1

  # ── 8b. Package tests — apt/deb and Homebrew on every supported target ──────
  # Each leg writes its own result row to the run summary. The hook list comes
  # from the tagged source tree, so it cannot drift from hooks/.
  package-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [release, wait-for-cdn]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: "apt/deb / Ubuntu 24.04",           os: ubuntu-24.04,  kind: deb }
          - { target: "apt/deb / Ubuntu 22.04",           os: ubuntu-22.04,  kind: deb }
          - { target: "Homebrew / macOS (macos-latest)",  os: macos-latest,  kind: brew }
          - { target: "Homebrew / Linux (ubuntu-latest)", os: ubuntu-latest, kind: brew }
    env:
      VERSION: ${{ needs.release.outputs.version }}
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.version }}
          sparse-checkout: hooks

      - name: Download and install .deb
        if: matrix.kind == 'deb'
        run: |
          DEB="agentguard_${VERSION}_all.deb"
          curl -fsSL -o "/tmp/${DEB}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DEB}"
          sudo apt-get install -y jq
          sudo dpkg -i "/tmp/${DEB}"
          echo "BIN_PATH=/usr/bin/agentguard" >> "$GITHUB_ENV"
          echo "LIB_DIR=/usr/lib/agentguard"  >> "$GITHUB_ENV"

      - name: Install Homebrew
        if: matrix.kind == 'brew' && runner.os == 'Linux'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          # Export HOMEBREW_PREFIX and other env vars for subsequent steps.
          /home/linuxbrew/.linuxbrew/bin/brew shellenv >> "$GITHUB_ENV"

      - name: Tap and install
        if: matrix.kind == 'brew'
        run: |
          brew tap SumonMSelim/agentguard
          brew install agentguard
          echo "BIN_PATH=$(brew --prefix)/bin/agentguard"              >> "$GITHUB_ENV"
          echo "LIB_DIR=$(brew --prefix)/opt/agentguard/libexec"       >> "$GITHUB_ENV"

      - name: Version matches release
        run: |
          out=$(agentguard version 2>&1)
          echo "$out"
          echo "$out" | grep -q "$VERSION" || { echo "FAIL: expected $VERSION"; exit 1; }

      - name: Binary present and executable
        run: test -x "$BIN_PATH"

      - name: Hooks present
        run: |
          for hook in hooks/*.sh; do
            test -f "$LIB_DIR/$hook" || { echo "MISSING: $hook"; exit 1; }
            echo "OK: $hook"
          done

      - name: Unknown agent returns error
        run: agentguard __test__ 2>&1 | grep -q "Unknown agent"

      - name: Install claude
        run: |
          out=$(agentguard claude 2>&1)
          echo "$out"
          echo "$out" | grep -qE "Done|SUCCESS|installed" || { echo "FAIL: install output unexpected"; exit 1; }

      - name: Verify claude install artifacts
        run: |
          test -f "$HOME/.claude/CLAUDE.md"     && echo "OK: CLAUDE.md"     || { echo "MISSING: CLAUDE.md"; exit 1; }
          test -f "$HOME/.claude/settings.json" && echo "OK: settings.json" || { echo "MISSING: settings.json"; exit 1; }
          test -d "$HOME/.claude/hooks"         && echo "OK: hooks dir"     || { echo "MISSING: hooks dir"; exit 1; }

      - name: brew test
        if: matrix.kind == 'brew'
        run: brew test agentguard

      - name: Write summary row
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          STATUS: ${{ job.status }}
        run: |
          if [[ "$STATUS" == "success" ]]; then result="✅ passed"; else result="❌ failed"; fi
          printf '| Target | Result |\n|--------|--------|\n| %s | %s |\n' "$TARGET" "$result" >> "$GITHUB_STEP_SUMMARY"

  # ── 9. Release summary ──────────────────────────────────────────────────────
  release-summary:
    name: Release summary
    runs-on: ubuntu-latest
    if: always()
    needs: [release, package-test]
    steps:
      - name: Write summary and set exit code
        env:
          VERSION: ${{ needs.release.outputs.version }}
          RESULT:  ${{ needs.package-test.result }}
        run: |
          echo "## Release v${VERSION} — package test results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" == "success" ]]; then
            echo "**✅ All package targets passed. v${VERSION} is stable.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**⚠️ One or more package targets did not pass (${RESULT:-skipped}). Release artifacts are published — investigate the per-target jobs above.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
