name: test-packages

# Runs after a release is published — tests the actual released artifacts
# on all supported OS targets. Not triggered on push/PR (that's test.yml).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 1.4.2 — no leading v)'
        required: true
        type: string

jobs:
  # ── Wait for GitHub CDN tarball to stabilise (Homebrew only) ───────────────
  # GitHub auto-generated tarballs have a non-deterministic SHA for ~2-3 min
  # after tag creation. Homebrew verifies the SHA; deb tests don't use it.
  wait-for-cdn:
    name: Wait for tarball SHA to stabilise
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Poll until tarball SHA is stable
        id: check
        run: |
          VERSION="${{ github.event.release.tag_name || format('v{0}', inputs.version) }}"
          VERSION="${VERSION#v}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          for i in $(seq 1 10); do
            SHA1=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            sleep 15
            SHA2=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
            if [[ "$SHA1" == "$SHA2" && -n "$SHA1" ]]; then
              echo "SHA stable after $i attempt(s): $SHA1"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i: SHA unstable, retrying..."
          done
          echo "ERROR: SHA never stabilised"
          exit 1

  # ── Homebrew: macOS (Apple Silicon) ────────────────────────────────────────
  homebrew-macos:
    name: Homebrew / macOS (macos-latest)
    runs-on: macos-latest
    needs: wait-for-cdn
    steps:
      - name: Tap and install
        run: |
          brew tap SumonMSelim/agentguard
          brew install agentguard

      - name: Version matches release
        run: |
          VERSION="${{ github.event.release.tag_name || format('v{0}', inputs.version) }}"
          VERSION="${VERSION#v}"
          out=$(agentguard version 2>&1)
          echo "$out"
          echo "$out" | grep -q "$VERSION" || { echo "FAIL: expected $VERSION"; exit 1; }

      - name: Binary present and executable
        run: test -x "$(brew --prefix)/bin/agentguard"

      - name: Hooks present in libexec
        run: |
          LIBEXEC="$(brew --prefix)/opt/agentguard/libexec"
          for hook in block-env.sh block-env-read.sh block-main-branch.sh \
                      block-system-installs.sh block-destructive-ops.sh audit-log.sh; do
            test -f "$LIBEXEC/hooks/$hook" || { echo "MISSING: $hook"; exit 1; }
            echo "OK: $hook"
          done

      - name: Unknown agent returns error
        run: agentguard __test__ 2>&1 | grep -q "Unknown agent"

      - name: Install claude
        run: |
          out=$(agentguard claude 2>&1)
          echo "$out"
          echo "$out" | grep -qE "Done|SUCCESS|installed" || { echo "FAIL: install output unexpected"; exit 1; }

      - name: Verify claude install artifacts
        run: |
          test -f "$HOME/.claude/CLAUDE.md"     && echo "OK: CLAUDE.md"     || { echo "MISSING: CLAUDE.md"; exit 1; }
          test -f "$HOME/.claude/settings.json" && echo "OK: settings.json" || { echo "MISSING: settings.json"; exit 1; }
          test -d "$HOME/.claude/hooks"         && echo "OK: hooks dir"     || { echo "MISSING: hooks dir"; exit 1; }

      - name: brew test
        run: brew test agentguard

  # ── Homebrew: Linux ─────────────────────────────────────────────────────────
  homebrew-linux:
    name: Homebrew / Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: wait-for-cdn
    steps:
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Tap and install
        run: |
          brew tap SumonMSelim/agentguard
          brew install agentguard

      - name: Version matches release
        run: |
          VERSION="${{ github.event.release.tag_name || format('v{0}', inputs.version) }}"
          VERSION="${VERSION#v}"
          out=$(agentguard version 2>&1)
          echo "$out"
          echo "$out" | grep -q "$VERSION" || { echo "FAIL: expected $VERSION"; exit 1; }

      - name: Binary present and executable
        run: test -x "$(brew --prefix)/bin/agentguard"

      - name: Hooks present in libexec
        run: |
          LIBEXEC="$(brew --prefix)/opt/agentguard/libexec"
          for hook in block-env.sh block-env-read.sh block-main-branch.sh \
                      block-system-installs.sh block-destructive-ops.sh audit-log.sh; do
            test -f "$LIBEXEC/hooks/$hook" || { echo "MISSING: $hook"; exit 1; }
            echo "OK: $hook"
          done

      - name: Unknown agent returns error
        run: agentguard __test__ 2>&1 | grep -q "Unknown agent"

      - name: Install claude
        run: |
          out=$(agentguard claude 2>&1)
          echo "$out"
          echo "$out" | grep -qE "Done|SUCCESS|installed" || { echo "FAIL: install output unexpected"; exit 1; }

      - name: Verify claude install artifacts
        run: |
          test -f "$HOME/.claude/CLAUDE.md"     && echo "OK: CLAUDE.md"     || { echo "MISSING: CLAUDE.md"; exit 1; }
          test -f "$HOME/.claude/settings.json" && echo "OK: settings.json" || { echo "MISSING: settings.json"; exit 1; }
          test -d "$HOME/.claude/hooks"         && echo "OK: hooks dir"     || { echo "MISSING: hooks dir"; exit 1; }

      - name: brew test
        run: brew test agentguard

  # ── apt/deb: Ubuntu 24.04 ───────────────────────────────────────────────────
  deb-ubuntu-24:
    name: apt/deb / Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Download and install .deb
        run: |
          VERSION="${{ github.event.release.tag_name || format('v{0}', inputs.version) }}"
          VERSION="${VERSION#v}"
          DEB="agentguard_${VERSION}_all.deb"
          curl -fsSL -o "/tmp/${DEB}" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DEB}"
          sudo apt-get install -y jq
          sudo dpkg -i "/tmp/${DEB}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Version matches release
        run: |
          out=$(agentguard version 2>&1)
          echo "$out"
          echo "$out" | grep -q "$VERSION" || { echo "FAIL: expected $VERSION"; exit 1; }

      - name: Binary present and executable
        run: test -x /usr/bin/agentguard

      - name: Hooks present
        run: |
          for hook in block-env.sh block-env-read.sh block-main-branch.sh \
                      block-system-installs.sh block-destructive-ops.sh audit-log.sh; do
            test -f "/usr/lib/agentguard/hooks/$hook" || { echo "MISSING: $hook"; exit 1; }
            echo "OK: $hook"
          done

      - name: Unknown agent returns error
        run: agentguard __test__ 2>&1 | grep -q "Unknown agent"

      - name: Install claude
        run: |
          out=$(agentguard claude 2>&1)
          echo "$out"
          echo "$out" | grep -qE "Done|SUCCESS|installed" || { echo "FAIL: install output unexpected"; exit 1; }

      - name: Verify claude install artifacts
        run: |
          test -f "$HOME/.claude/CLAUDE.md"     && echo "OK: CLAUDE.md"     || { echo "MISSING: CLAUDE.md"; exit 1; }
          test -f "$HOME/.claude/settings.json" && echo "OK: settings.json" || { echo "MISSING: settings.json"; exit 1; }
          test -d "$HOME/.claude/hooks"         && echo "OK: hooks dir"     || { echo "MISSING: hooks dir"; exit 1; }

  # ── apt/deb: Ubuntu 22.04 ───────────────────────────────────────────────────
  deb-ubuntu-22:
    name: apt/deb / Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - name: Download and install .deb
        run: |
          VERSION="${{ github.event.release.tag_name || format('v{0}', inputs.version) }}"
          VERSION="${VERSION#v}"
          DEB="agentguard_${VERSION}_all.deb"
          curl -fsSL -o "/tmp/${DEB}" \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DEB}"
          sudo apt-get install -y jq
          sudo dpkg -i "/tmp/${DEB}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Version matches release
        run: |
          out=$(agentguard version 2>&1)
          echo "$out"
          echo "$out" | grep -q "$VERSION" || { echo "FAIL: expected $VERSION"; exit 1; }

      - name: Binary present and executable
        run: test -x /usr/bin/agentguard

      - name: Hooks present
        run: |
          for hook in block-env.sh block-env-read.sh block-main-branch.sh \
                      block-system-installs.sh block-destructive-ops.sh audit-log.sh; do
            test -f "/usr/lib/agentguard/hooks/$hook" || { echo "MISSING: $hook"; exit 1; }
            echo "OK: $hook"
          done

      - name: Install claude
        run: |
          out=$(agentguard claude 2>&1)
          echo "$out"
          echo "$out" | grep -qE "Done|SUCCESS|installed" || { echo "FAIL: install output unexpected"; exit 1; }

      - name: Verify claude install artifacts
        run: |
          test -f "$HOME/.claude/CLAUDE.md"     && echo "OK: CLAUDE.md"     || { echo "MISSING: CLAUDE.md"; exit 1; }
          test -f "$HOME/.claude/settings.json" && echo "OK: settings.json" || { echo "MISSING: settings.json"; exit 1; }
          test -d "$HOME/.claude/hooks"         && echo "OK: hooks dir"     || { echo "MISSING: hooks dir"; exit 1; }
