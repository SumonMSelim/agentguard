name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y jq
      # macOS runners ship jq. The macOS leg runs the suites against BSD sed/grep/awk/find.
      - run: bash --version | head -n1 && jq --version
      - run: bash tests/check-sync.sh
      - run: bash install.sh all
      - run: bash tests/run_all.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # -S warning: info/style findings (quoting style, `cat file | ...`) are
      # not bugs here. SC2088: "~/..." in quotes is display text in log lines
      # and test labels, never a path that should expand.
      - run: shellcheck --version && shellcheck -S warning -e SC2088 install.sh hooks/*.sh tests/*.sh
